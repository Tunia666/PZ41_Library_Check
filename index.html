<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Check — ПЗ 41</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="hero"></header>
      <div class="layout">
        <section class="card">
          <h2>Доступні книги</h2>
          <p class="muted">
            Результат з'явиться після імітації запиту до каталогу.
          </p>
          <div class="field">
            <label for="book-select">Назва кнiгi</label>
            <select id="book-select">
              <option value="atlas">Атлас світу</option>
              <option value="novel">Загадки океану</option>
              <option value="guide">Путівник з космосу</option>
              <option value="homersimpson">Конституція України</option>
            </select>
          </div>
          <div class="controls">
            <button class="btn btn--primary" id="check-button">
              Перевірити наявність
            </button>
          </div>
        </section>
        <section class="card">
          <h2>Відповідь каталогу</h2>
          <div class="output" id="result" aria-live="polite">
           Виберіть книгу та запустіть перевірку.
          </div>
          <p class="status" id="status" role="status">Очікування перевірки.</p>
        </section>
      </div>
    </main>
  </body>
</html>
